name: AIOStreams
version: "0.1.0"
slug: aiostreams
description: Self-host AIOStreams, the configurable Stremio add-on aggregator
url: https://github.com/bitosome/ha-aiostreams
arch:
  - amd64
  - aarch64
backup: cold
webui: http://[HOST]:[PORT:3000]/stremio/configure
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: AIOStreams web interface and Stremio add-on endpoint
options:
  base_url: null
  admin_username: admin
  admin_password: null
  protect_configure_page: true
  secret_key: ""
  log_level: info
schema:
  base_url: url
  admin_username: str(1,64)
  admin_password: password
  protect_configure_page: bool
  secret_key: password
  log_level: list(error|warn|info|http|verbose|debug|silly)
